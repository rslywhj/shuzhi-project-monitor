name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build and run tests
        run: npm run test

  deploy-production:
    name: Deploy Cloudflare production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://itpm.dougge.top
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build and deploy Worker
        run: npm run deploy:cloudflare:ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production health
        shell: bash
        run: |
          probe() {
            curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              --header 'Cache-Control: no-cache' \
              --user-agent 'shuzhi-project-monitor-ci/1.0' \
              "$1"
          }
          if ! health="$(probe https://itpm.dougge.top/api/health)"; then
            echo "::warning::Custom domain rejected the GitHub runner; verifying the deployed Worker origin instead."
            health="$(curl --fail --silent --show-error \
              --retry 10 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 20 \
              https://shuzhi-project-monitor.849916182.workers.dev/api/health)"
          fi
          printf '%s\n' "$health"
          grep -q '"status":"ok"' <<<"$health"
          grep -q '"database":"connected"' <<<"$health"
